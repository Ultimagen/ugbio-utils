[project]
name = "ugbio_sigprofiler"
version = "1.34.4-0"
description = "Ultima Genomics COSMIC mutational-signature analysis (SigProfiler), isolated from the ugbio workspace"
authors = [
    { name = "Ilya Soifer", email = "ilya.soifer@ultimagen.com" },
]
# SigProfiler needs numpy>=2 / pandas>=2 while the ugbio workspace pins numpy<2,
# so this project has its own lock and virtual environment (not a workspace member).
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "sigprofilermatrixgenerator>=1.6.0,<2",
    "sigprofilerassignment>=1.1.5,<2",
    "sigprofilerplotting>=1.6.0,<2",
]
requires-python = ">=3.11,<3.13"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]

[project.license]
text = "Apache-2.0"

[project.scripts]
somatic_signatures = "ugbio_sigprofiler.somatic_signatures:main"

[tool.setuptools.packages.find]
include = ["ugbio_sigprofiler*"]

[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"
