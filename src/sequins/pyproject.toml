[project]
name = "ugbio_sequins"
version = "1.34.4-0"
description = "Ultima Genomics sequins analysis reports"
authors = [
    { name = "Gil Hornung", email = "gil.hornung@ultimagen.com" },
]
requires-python = ">=3.11"
readme = "README.sequins.md"

[project.license]
text = "Apache-2.0"

[project.scripts]
run_tests = "pytest:main"
sequins_report = "ugbio_sequins.sequins_report:main"

[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"
