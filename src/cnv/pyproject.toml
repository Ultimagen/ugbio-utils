[project]
name = "ugbio_cnv"
version = "1.33.2-0"
requires-python = ">=3.11"
dependencies = [
    "ugbio_core[vcfbed,parquet]",
    "seaborn>=0.13.2,<1.0.0",
    "setuptools>=75.8.0,<82.0.0",
    "numba>=0.60.0",
]
description = "Ultima Genomics CNV utils"
authors = [
    { name = "Tammy Biniashvili", email = "tammy.biniashvili@ultimagen.com" },
    { name = "Avigail Moldovan", email = "avigail.moldovan@ultimagen.com" },
    { name = "Ilya Soifer", email = "ilya.soifer@ultimagen.com" },
]
readme = "README.cnv.md"

[project.license]
text = "Apache-2.0"

[project.scripts]
run_tests = "pytest:main"
process_cnvs = "ugbio_cnv.process_cnvs:main"
plot_cnv_results = "ugbio_cnv.plot_cnv_results:main"
bicseq2_post_processing = "ugbio_cnv.bicseq2_post_processing:main"
annotate_FREEC_segments = "ugbio_cnv.annotate_FREEC_segments:main"
plot_FREEC_neutral_AF = "ugbio_cnv.plot_FREEC_neutral_AF:main"
analyze_cnv_breakpoint_reads = "ugbio_cnv.analyze_cnv_breakpoint_reads:main"
merge_cnv_sv = "ugbio_cnv.merge_cnv_sv:main"
reformat_parascopy_bed = "ugbio_cnv.reformat_parascopy_bed:main"
lpa_caller = "ugbio_cnv.lpa_caller:main"
estimate_ploidy = "ugbio_cnv.estimate_ploidy:main"
build_depth_annotation = "ugbio_cnv.depth_annotation:main"
call_depth_cnvs = "ugbio_cnv.depth_cnv_caller:main"
split_read_cnv_candidates = "ugbio_cnv.split_read_candidates:main"
pair_cnv_candidates = "ugbio_cnv.pair_candidates:main"
filter_nested_cnv_candidates = "ugbio_cnv.split_read_candidates:main_nested"
snap_cnv_breakpoints = "ugbio_cnv.breakpoint_snapping:main"
cnv_known_event_pieces = "ugbio_cnv.known_event_pieces:main"

[tool.uv.sources.ugbio_core]
workspace = true

[tool.setuptools]
packages = [
    "ugbio_cnv",
]

[build-system]
requires = [
    "setuptools>=61.0,<82.0.0",
]
build-backend = "setuptools.build_meta"
