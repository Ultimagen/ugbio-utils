name: "Trivy Image Scan"
description: "Scan a Docker image (or the repository file system) for vulnerabilities and secrets, generate summary, upload findings and apply the CVE gate"

inputs:
  scan-type:
    description: "'image' scans image-ref, 'fs' scans the checked-out repository at scan-ref (default: image)"
    required: false
    default: "image"
  image-ref:
    description: "Docker image reference (registry/image:tag), used when scan-type=image"
    required: false
    default: ""
  scan-ref:
    description: "Path to scan when scan-type=fs (default: .)"
    required: false
    default: "."
  image-name:
    description: "Docker image name (for summary display)"
    required: true
  image-tag:
    description: "Docker image tag (for summary display)"
    required: true
  policy:
    description: "CVE policy: 'warn' flags findings only, 'block' fails on CRITICAL with a fix or CRITICAL in language packages (default: warn)"
    required: false
    default: "warn"
  ignore-unfixed:
    description: "Ignore unfixed vulnerabilities (default: false, so EOL libraries such as log4j 1.x are reported)"
    required: false
    default: "false"
  trivy-version:
    description: "Trivy version to run (default: v0.70.0)"
    required: false
    default: "v0.70.0"
  artifact-retention-days:
    description: "Number of days to retain scan artifacts (default: 30)"
    required: false
    default: "30"

outputs:
  blocked:
    description: "'true' if policy=block and blocking findings were found"
    value: ${{ steps.gate.outputs.blocked }}
  blocking-count:
    description: "Number of blocking findings"
    value: ${{ steps.gate.outputs.blocking-count }}

runs:
  using: "composite"
  steps:
    - name: Run Trivy scan
      id: trivy-image
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        scan-ref: ${{ inputs.scan-ref }}
        version: ${{ inputs.trivy-version }}
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        scanners: 'vuln,secret'
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        format: 'json'
        output: 'trivy-${{ inputs.scan-type }}-results.json'
        exit-code: '0'

    - name: Prepare artifact name
      if: always()
      id: artifact-name
      shell: bash
      run: |
        # Sanitize artifact name by replacing invalid characters (/, :, etc.) with hyphens
        SANITIZED_NAME=$(echo "${{ inputs.image-name }}-${{ inputs.image-tag }}" | sed 's/[\/:]/-/g')
        echo "name=trivy-${{ inputs.scan-type }}-findings-${SANITIZED_NAME}" >> $GITHUB_OUTPUT

    - name: Upload Trivy image scan artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: trivy-${{ inputs.scan-type }}-results.json
        retention-days: ${{ inputs.artifact-retention-days }}

    - name: Generate Trivy summary and apply CVE gate
      id: gate
      if: always()
      shell: bash
      run: |
        python3 ${{ github.action_path }}/trivy_json_to_summary.py \
          --results-file trivy-${{ inputs.scan-type }}-results.json \
          --scan-type "${{ inputs.scan-type }}" \
          --image-name "${{ inputs.image-name }}" \
          --image-tag "${{ inputs.image-tag }}" \
          --policy "${{ inputs.policy }}" \
          --github-step-summary "$GITHUB_STEP_SUMMARY"
