name: "Trivy Image Scan"
description: "Scan a built Docker image with Trivy, write the findings to the job summary and upload the full results. The step fails only when policy is 'block' and a blocking vulnerability is found."

inputs:
  image-ref:
    description: "Docker image reference (registry/image:tag)"
    required: true
  image-name:
    description: "Docker image name (for summary display)"
    required: true
  image-tag:
    description: "Docker image tag (for summary display)"
    required: true
  policy:
    description: "'warn' (default): only report findings. 'block': fail if the image has a CRITICAL vulnerability that has a fix, or a CRITICAL vulnerability in a library (jar, pip, npm, ...)"
    required: false
    default: "warn"
  ignore-unfixed:
    description: "Ignore unfixed vulnerabilities (default: false)"
    required: false
    default: "false"
  artifact-retention-days:
    description: "Number of days to retain scan artifacts (default: 30)"
    required: false
    default: "30"

outputs:
  blocked:
    description: "'true' if policy=block and blocking findings were found"
    value: ${{ steps.gate.outputs.blocked }}
  blocking-count:
    description: "Number of blocking findings"
    value: ${{ steps.gate.outputs.blocking-count }}

runs:
  using: "composite"
  steps:
    - name: Run Trivy to scan built image
      id: trivy-image
      continue-on-error: true
      # Pinned by commit SHA; the Trivy version (v0.70.0) is the default of this action version
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'image'
        image-ref: ${{ inputs.image-ref }}
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        scanners: 'vuln,secret'
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        format: 'json'
        output: 'trivy-results.json'
        exit-code: '0'

    - name: Prepare artifact name
      if: always()
      id: artifact-name
      shell: bash
      run: |
        # Sanitize artifact name by replacing invalid characters (/, :, etc.) with hyphens
        SANITIZED_NAME=$(echo "${{ inputs.image-name }}-${{ inputs.image-tag }}" | sed 's/[\/:]/-/g')
        echo "name=trivy-image-findings-${SANITIZED_NAME}" >> $GITHUB_OUTPUT

    - name: Upload Trivy image scan artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: trivy-results.json
        retention-days: ${{ inputs.artifact-retention-days }}

    - name: Generate Trivy summary and apply CVE gate
      id: gate
      if: always()
      shell: bash
      run: |
        python3 ${{ github.action_path }}/trivy_json_to_summary.py \
          --results-file trivy-results.json \
          --image-name "${{ inputs.image-name }}" \
          --image-tag "${{ inputs.image-tag }}" \
          --policy "${{ inputs.policy }}" \
          --github-step-summary "$GITHUB_STEP_SUMMARY"
