name: "Build Provenance"
description: "Record which ugbio-utils commit runs the shared docker workflow and which commit of the built repository is checked out. Never fails the build: a value that cannot be found is 'unknown'."

inputs:
  github-token:
    description: "Token for the fallback lookup of the run's referenced_workflows (needs actions: read)"
    required: false
    default: ${{ github.token }}

outputs:
  ugbio-utils-ref:
    description: "The shared workflow file and ref that run the job (job_workflow_ref)"
    value: ${{ steps.record.outputs.ugbio_utils_ref }}
  ugbio-utils-sha:
    description: "The ugbio-utils commit that runs the job (job_workflow_sha)"
    value: ${{ steps.record.outputs.ugbio_utils_sha }}
  source-sha:
    description: "The checked-out commit of the built repository"
    value: ${{ steps.record.outputs.source_sha }}

runs:
  using: "composite"
  steps:
    - name: Record build provenance
      id: record
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: python3 "${{ github.action_path }}/record_build_provenance.py"
