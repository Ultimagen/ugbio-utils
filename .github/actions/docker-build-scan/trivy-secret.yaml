# Trivy secret scanning config, added to Trivy's built-in rules.
allow-rules:
  - id: r-package-docs
    description: Example keys in R package documentation (e.g. the openssl package's keys vignette)
    path: (^|/)site-library/[^/]+/doc/
  - id: r-gargle-fake-service-account
    description: Dummy service-account key the R gargle package ships for its own tests (pulled in by tidyverse)
    path: (^|/)site-library/gargle/extdata/fake_service_account\.json$
